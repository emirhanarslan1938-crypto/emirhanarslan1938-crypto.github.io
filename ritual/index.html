<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritüel">
<title>Ritüel — Gece Albüm Günlüğü</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --bg2:#101013; --card:#16161a; --card2:#1c1c21; --line:#27272d; --line2:#34343b;
  --text:#f3f3f5; --mute:#8d8d96; --dim:#5d5d66;
  --red:#e3262d; --red2:#ff3b3b; --ember:#ff6a2b; --amber:#f5a524; --cold:#6b6b75;
  --r:16px; --nav:64px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
img{display:block}
a{color:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--st) + 10px) 18px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(var(--bg) 70%, rgba(10,10,12,0));}
.logo{font-family:'UnifrakturMaguntia',serif;font-size:30px;letter-spacing:.5px;line-height:1;color:var(--text)}
.logo b{color:var(--red);font-weight:400}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

main{padding:0 16px calc(var(--nav) + var(--sb) + 96px);max-width:640px;margin:0 auto}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1,h2,h3{margin:0}
.h-sec{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;color:var(--mute);font-weight:600;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.h-sec a,.h-sec button{color:var(--red2);font-family:Inter;letter-spacing:0;text-transform:none;font-size:13px;font-weight:600}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);
  background:rgba(12,12,14,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--dim)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on svg{color:var(--red2)}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line2)}
.btn.red{background:linear-gradient(180deg,#ef2f36,#c81d24);border-color:#ff4d52;box-shadow:0 6px 24px -8px rgba(227,38,45,.7)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.muted{color:var(--mute)}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip.on{background:rgba(227,38,45,.16);border-color:var(--red);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cover{background:#1a1a1f center/cover;border-radius:10px;overflow:hidden;flex:none;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.ph{display:grid;place-items:center;color:var(--dim)}
.cover.ph svg{width:40%;height:40%}
.badge{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-weight:700;font-size:15px;min-width:42px;height:30px;padding:0 8px;border-radius:9px;display:inline-grid;place-items:center;color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty .big{font-size:42px;margin-bottom:8px}
input.field,textarea.field,select.field{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none}
input.field:focus,textarea.field:focus{border-color:var(--red)}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.8px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 20px 20px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(227,38,45,.35),transparent 60%),
  radial-gradient(80% 80% at 0% 100%,rgba(255,106,43,.12),transparent 60%),var(--card);border:1px solid var(--line)}
.hero h1{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.5px}
.hero p{margin:8px 0 18px;color:var(--mute)}
.hero .row{display:flex;gap:10px}
.hero .row .btn{flex:1}
.streak{display:flex;gap:10px;margin-top:12px}
.streak .s{flex:1;padding:12px 14px}
.streak .s .n{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:26px;font-weight:700;line-height:1}
.streak .s .l{font-size:12px;color:var(--mute);margin-top:4px}
.week{display:flex;gap:6px;margin-top:12px}
.week .d{flex:1;aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden;position:relative}
.week .d img{width:100%;height:100%;object-fit:cover;opacity:.9}
.week .d span{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.week .d.today{border-color:var(--red)}

/* ---------- list rows ---------- */
.lrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px}
.lrow:active{background:var(--card)}
.lrow .t{flex:1;min-width:0}
.lrow .t .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t .b{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t .c{font-size:12px;color:var(--dim);margin-top:2px}

/* ---------- session ---------- */
.sess-head{position:relative;margin:0 -16px;padding:4px 16px 18px;overflow:hidden}
.sess-head .bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.45;transform:scale(1.2)}
.sess-head .bgblur::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,10,12,.2),var(--bg) 92%)}
.sess-head .inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.sess-head .cover{width:min(68vw,280px);height:min(68vw,280px);border-radius:14px;box-shadow:0 24px 60px -18px rgba(0,0,0,.9)}
.sess-head h2{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:26px;line-height:1.1;margin-top:16px;text-transform:uppercase;letter-spacing:.3px}
.sess-head .artist{color:var(--red2);font-weight:700;margin-top:4px;font-size:16px}
.sess-head .meta{color:var(--mute);font-size:13px;margin-top:6px}
.links{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.links a{text-decoration:none}
.prog{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--red2));border-radius:9px;transition:width .3s}
.trk{padding:12px 12px 12px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk .top{display:flex;align-items:center;gap:10px}
.trk .no{font-family:Oswald,'Arial Narrow',Impact,sans-serif;color:var(--dim);font-size:14px;width:22px;flex:none}
.trk .nm{flex:1;min-width:0;font-weight:600}
.trk .du{font-size:12px;color:var(--dim);flex:none}
.trk .ic{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--dim);flex:none}
.trk .ic svg{width:19px;height:19px}
.trk .ic.fav{color:#ffcc33}
.trk .ic.has{color:var(--text)}
.trk.skip .nm{color:var(--dim);text-decoration:line-through}
.rate{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:10px}
.rate button{height:34px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-weight:600;font-size:14px;color:var(--mute);transition:background .12s,transform .08s}
.rate button:active{transform:scale(.92)}
.rate button.sk{font-family:Inter;font-size:16px}
.rate button.on{color:#fff;border-color:transparent}
.rate button.fill{color:#fff}
.trk .note{margin-top:10px}
.trk .note textarea{min-height:44px;resize:vertical;font-size:14px}
.trk .notetxt{font-size:13px;color:var(--mute);margin:8px 0 0 32px;font-style:italic}
.final{padding:18px}
.final .big{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:64px;font-weight:700;line-height:1;text-align:center}
.final .sub{text-align:center;color:var(--mute);font-size:13px;margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin-top:12px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(90deg,#3a3a42,var(--amber),var(--ember),var(--red2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.6);border:3px solid var(--red)}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:linear-gradient(90deg,#3a3a42,var(--amber),var(--ember),var(--red2))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb));z-index:25;padding:10px 16px;background:linear-gradient(rgba(10,10,12,0),var(--bg) 30%)}
.savebar .in{max-width:608px;margin:0 auto;display:flex;gap:10px;align-items:center;background:rgba(28,28,33,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:18px;padding:8px 8px 8px 16px}
.savebar .avg{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:24px;font-weight:700;line-height:1}
.savebar .avgl{font-size:11px;color:var(--mute)}
.savebar .btn{margin-left:auto}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;max-height:92dvh;background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;border:1px solid var(--line);border-bottom:0;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;flex:none}
.sheet .sh h3{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:18px;flex:1}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(24px + var(--sb));flex:1}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.searchbox input{padding-left:42px;height:50px;font-size:16px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--red2);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.dlg .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:20px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.dlg h4{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 18px;color:var(--mute)}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 90px);transform:translate(-50%,20px);opacity:0;z-index:70;background:#fff;color:#000;font-weight:700;padding:12px 18px;border-radius:14px;transition:.25s;pointer-events:none;white-space:nowrap;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- journal ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 var(--line2) inset}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.cal-h h3{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;color:var(--dim);font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--card);position:relative;overflow:hidden;border:1px solid transparent}
.cal .c.out{background:transparent}
.cal .c img{width:100%;height:100%;object-fit:cover}
.cal .c .dn{position:absolute;top:3px;left:5px;font-size:11px;font-weight:700;color:var(--mute)}
.cal .c.has .dn{color:#fff;text-shadow:0 1px 3px #000}
.cal .c.today{border-color:var(--red)}
.cal .c .cnt{position:absolute;right:3px;bottom:3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:0 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .g{position:relative}
.grid3 .g .cover{width:100%;aspect-ratio:1;height:auto}
.grid3 .g .badge{position:absolute;right:5px;bottom:5px;min-width:34px;height:24px;font-size:13px;border-radius:7px}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{padding:14px}
.kpi .n{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:30px;font-weight:700;line-height:1}
.kpi .l{font-size:12px;color:var(--mute);margin-top:6px}
.bars .br{display:flex;align-items:center;gap:10px;margin:9px 0}
.bars .br .k{width:96px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.bars .br .v{flex:1;height:10px;border-radius:9px;background:var(--card2);overflow:hidden}
.bars .br .v i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ember),var(--red2))}
.bars .br .x{width:44px;text-align:right;font-size:12px;color:var(--mute);flex:none}
.hist{display:flex;align-items:flex-end;gap:5px;height:110px;padding:10px 4px 0}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.hist .col i{width:100%;border-radius:6px 6px 3px 3px;min-height:3px}
.hist .col span{font-size:11px;color:var(--dim);font-weight:700}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;justify-content:end}
.heat i{border-radius:3px;background:var(--card2)}
.rank{display:flex;align-items:center;gap:12px;padding:8px 4px}
.rank .p{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:18px;color:var(--dim);width:20px;text-align:center;flex:none}
.rank .t{flex:1;min-width:0}
.rank .t .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .t .b{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- queue ---------- */
.dice{font-size:44px;display:inline-block}
.dice.roll{animation:roll .6s ease}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
.pick{display:flex;gap:14px;align-items:center;padding:14px;margin-top:12px}

/* ---------- v2 additions ---------- */
nav.tabs button{font-size:10.5px}
.trk.playing{background:linear-gradient(90deg,rgba(227,38,45,.12),transparent 70%)}
.trk .no{background:none;border:0;padding:0;text-align:left;cursor:pointer;height:28px;display:flex;align-items:center}
.trk.playing .no{color:var(--red2)}
.trk.playing .du{color:var(--red2);font-weight:700}
.trk .pv{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:1px}
.trk .ic.fire.has{color:var(--ember)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--red2);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.moments{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.moments:empty{display:none}
.mchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:99px;background:rgba(255,106,43,.14);border:1px solid rgba(255,106,43,.35);font-size:12px;font-weight:600;color:#ffd2bd}
.mchip button{width:22px;height:22px;border-radius:50%;font-size:11px;color:#ffb89a}
.mchip.ro{padding-right:10px}
.relisten{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 12px;border-radius:99px;background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.35);color:#ffd88a;font-size:13px;font-weight:600}
.seg.sm button{height:32px;font-size:13px}
.nextup{display:flex;gap:12px;align-items:center;padding:12px;margin-top:12px}
.nextup .t{flex:1;min-width:0}
.nextup .t .k{font-size:11px;font-weight:700;color:var(--ember);letter-spacing:.8px;text-transform:uppercase}
.nextup .t .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .t .b{font-size:12px;color:var(--mute)}
.jcard{padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.collage{width:72px;height:72px;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;flex:none;background:var(--card2)}
.collage img{width:100%;height:100%;object-fit:cover}
.jcard .t{flex:1;min-width:0}
.jcard .t .a{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jcard .t .b{font-size:12px;color:var(--mute);margin-top:2px}
.jalb{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.jalb:last-child{border-bottom:0}
.jalb.ex{opacity:.38}
.jalb .t{flex:1;min-width:0}
.jalb .t .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jalb .t .b{font-size:12px;color:var(--mute)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}

(() => {

/* =========================================================

    ARRAYS.forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });

}
function save() {

}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* =========================================================

const $ = (s, r = document) => r.querySelector(s);

}

const strip = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '');

/* ---------- dialogs ---------- */
function dialog({ title, text, ok = 'Tamam', cancel = 'Vazgeç' }) {

/* =========================================================

function jsonp(url, cbParam = 'callback') {
  return new Promise((resolve, reject) => {
    const cb = '__jp' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 12000);
    function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
    window[cb] = data => { done(); if (data && data.error) reject(new Error('api')); else resolve(data); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = url + (url.includes('?') ? '&' : '?') + cbParam + '=' + cb;
    document.head.appendChild(s);
  });
}
const itArt = (u, n) => u ? u.replace(/\/\d+x\d+bb\./, `/${n}x${n}bb.`) : null;

});

const EXCL = /\b(live|single|ep|tour|karaoke|tribute|interview|best of|greatest hits|hits|collection|anthology|demos?|instrumentals?|remix(es)?|essentials|playlist|unplugged|b-sides|rarities|box set|sessions|commentary)\b/i;

const API = {
  search(term, source) { return source === 'deezer' ? API.dzSearch(term) : API.itSearch(term); },
  async itSearch(term) {
    const d = await jsonp(`https://itunes.apple.com/search?term=${enc(term)}&entity=album&media=music&limit=40&country=${cc()}`);
    return (d.results || []).filter(r => r.collectionId).map(mapIt);
  },
  async dzSearch(term) {
    const d = await jsonp(`https://api.deezer.com/search/album?q=${enc(term)}&limit=40&output=jsonp`);
    return (d.data || []).map(r => mapDz(r));
  },
  async tracks(album) {
    if (album.source === 'itunes') {
      const d = await jsonp(`https://itunes.apple.com/lookup?id=${album.sourceId}&entity=song&limit=300&country=${cc()}`);
      const res = d.results || [];
      const col = res.find(r => r.wrapperType === 'collection');
      if (col) {
        album.genre = album.genre || col.primaryGenreName || '';
        if (!album.year && col.releaseDate) album.year = +col.releaseDate.slice(0, 4);
        if (!album.cover && col.artworkUrl100) { album.cover = itArt(col.artworkUrl100, 600); album.thumb = itArt(col.artworkUrl100, 200); }
      }
      return res.filter(r => r.wrapperType === 'track')
        .sort((a, b) => (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber))
        .map(r => ({ n: r.trackNumber, disc: r.discNumber || 1, title: r.trackName, ms: r.trackTimeMillis || 0 }));
    }
    if (album.source === 'deezer') {
      const [info, tr] = await Promise.all([
        jsonp(`https://api.deezer.com/album/${album.sourceId}?output=jsonp`).catch(() => ({})),
        jsonp(`https://api.deezer.com/album/${album.sourceId}/tracks?limit=300&output=jsonp`)
      ]);
      if (info.release_date) album.year = +info.release_date.slice(0, 4);
      if (info.genres && info.genres.data && info.genres.data[0]) album.genre = info.genres.data[0].name;
      return (tr.data || []).map((r, i) => ({ n: r.track_position || i + 1, disc: r.disk_number || 1, title: r.title, ms: (r.duration || 0) * 1000 }));
    }
    return [];
  },
  async artists(term, source) {
    if (source === 'deezer') {
      const d = await jsonp(`https://api.deezer.com/search/artist?q=${enc(term)}&limit=15&output=jsonp`);
      return (d.data || []).map(r => ({ source: 'deezer', artistId: String(r.id), name: r.name, sub: r.nb_fan ? `${r.nb_fan.toLocaleString('tr-TR')} hayran` : '', picture: r.picture_medium }));
    }
    const d = await jsonp(`https://itunes.apple.com/search?term=${enc(term)}&entity=musicArtist&media=music&limit=15&country=${cc()}`);
    return (d.results || []).filter(r => r.artistId).map(r => ({ source: 'itunes', artistId: String(r.artistId), name: r.artistName, sub: r.primaryGenreName || '', picture: null }));
  },
  async discography(ar) {
    let list = [];
    if (ar.source === 'itunes') {
      const d = await jsonp(`https://itunes.apple.com/lookup?id=${ar.artistId}&entity=album&limit=200&country=${cc()}`);
      list = (d.results || []).filter(r => r.wrapperType === 'collection').map(mapIt);
    } else {
      const d = await jsonp(`https://api.deezer.com/artist/${ar.artistId}/albums?limit=200&output=jsonp`);
      list = (d.data || []).filter(r => !r.record_type || r.record_type === 'album').map(r => mapDz(r, ar.name));
    }
    const m = new Map();
    for (const a of list) {
      const k = normT(a.title); if (!k) continue;
      const p = m.get(k);
      const better = !p || (a.year && (!p.year || a.year < p.year)) ||
        (a.year === p.year && /remaster|deluxe|edition/i.test(p.title) && !/remaster|deluxe|edition/i.test(a.title));
      if (better) m.set(k, a);
    }
    return [...m.values()]
      .map(a => ({ ...a, artist: ar.name, excluded: EXCL.test(a.title) || (a.trackCount > 0 && a.trackCount < 4) }))
      .sort((a, b) => (a.year || 9999) - (b.year || 9999));
  },
  async related(name) {
    const s = await jsonp(`https://api.deezer.com/search/artist?q=${enc(name)}&limit=5&output=jsonp`);
    const arr = s.data || [];
    const pick = arr.find(a => normA(a.name) === normA(name)) || arr[0];
    if (!pick) return [];
    const r = await jsonp(`https://api.deezer.com/artist/${pick.id}/related?limit=15&output=jsonp`);
    return (r.data || []).map(a => ({ id: a.id, name: a.name, picture: a.picture_medium || a.picture, fans: a.nb_fan || 0 }));
  },
  async mbArtist(name) {
    const r = await fetch(`https://musicbrainz.org/ws/2/artist/?query=${enc('artist:"' + name.replace(/"/g, '') + '"')}&fmt=json&limit=5`);
    if (!r.ok) throw new Error('MusicBrainz ' + r.status);
    const d = await r.json(); const arr = d.artists || []; const n = normA(name);
    const pick = arr.find(a => normA(a.name) === n && a.country) || arr.find(a => normA(a.name) === n) || (arr[0] && arr[0].score >= 95 ? arr[0] : null);
    let c = pick && pick.country;
    if (c && (c.length !== 2 || /^X/.test(c))) c = null;
    const tags = pick && pick.tags ? [...pick.tags].sort((a, b) => (b.count || 0) - (a.count || 0)).map(t => t.name) : [];
    return { c: c || null, tags };
  }
};

function trackAvg(tracks) {
  const s = tracks.filter(t => !t.skip && t.score != null).map(t => t.score);
  return s.length ? s.reduce((a, b) => a + b, 0) / s.length : null;
}
const finalScore = log => log.albumScore != null ? log.albumScore : trackAvg(log.tracks);
const totalMs = tracks => tracks.reduce((a, t) => a + (t.ms || 0), 0);
const sortedLogs = () => [...S.logs].sort((a, b) => (b.date.localeCompare(a.date)) || (b.createdAt - a.createdAt));
function logsByDate(list = S.logs) { const m = {}; for (const l of list) (m[l.date] = m[l.date] || []).push(l); return m; }
const logsForAlbum = (a, exceptId) => S.logs.filter(l => l.id !== exceptId && albumKey(l.album) === albumKey(a)).sort((x, y) => y.date.localeCompare(x.date) || y.createdAt - x.createdAt);
function prevScores(a, exceptId) {
  const p = logsForAlbum(a, exceptId)[0]; if (!p) return null;
  const m = {}; p.tracks.forEach(t => { if (t.score != null) m[normT(t.title)] = t.score; }); return { log: p, map: m };
}
function bestRun(dates) {
  const sorted = [...new Set(dates)].sort(); let best = 0, run = 0, prev = null;
  for (const s of sorted) { const dt = parseYmd(s); if (prev && Math.round((dt - prev) / 864e5) === 1) run++; else run = 1; best = Math.max(best, run); prev = dt; }
  return best;
}
function streaks() {
  const days = new Set(S.logs.map(l => l.date));
  let cur = 0; const d = new Date();

  while (days.has(ymd(d))) { cur++; d.setDate(d.getDate() - 1); }
  return { cur, best: bestRun([...days]), listenedToday: days.has(today()) };
}
const countryOf = artist => { const e = S.meta.countries[normA(artist)]; return e ? e.c : undefined; };

    id: opts.id || uid(), editing: !!opts.editing, date: opts.date || today(), createdAt: opts.createdAt || Date.now(),
    album, tracks: tracks.map(t => ({ score: null, skip: false, fav: false, note: '', moments: [], ...t })),
    albumScore: opts.albumScore ?? null, note: opts.note || '', tags: opts.tags || guessTags(album.genre),

function defaultMedium(a) {

function guessTags(g) {

  if (g.includes('hard rock')) return ['Hard Rock'];

  const done = items.filter(x => x.logs.length).length;
  return { items, done, total: inc.length, next: items.find(x => !x.logs.length), complete: inc.length > 0 && done === inc.length };
}

let sheetStack = [];
function openSheet(title, bodyHtml, onMount, opts = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet';
  if (opts.full) sh.style.height = '92dvh';
  sh.innerHTML = `<div class="grab"></div><div class="sh"><h3 lang="${opts.lang || 'tr'}">${esc(title)}</h3><button class="iconbtn" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="sb">${bodyHtml}</div>`;
  document.body.append(scrim, sh);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { scrim.classList.add('on'); sh.classList.add('on'); });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    scrim.classList.remove('on'); sh.classList.remove('on');
    setTimeout(() => { scrim.remove(); sh.remove(); }, 300);
    sheetStack = sheetStack.filter(x => x !== close);
    if (!sheetStack.length) document.body.style.overflow = '';
    opts.onClose && opts.onClose();
  };
  sheetStack.push(close);
  scrim.onclick = close; $('[data-close]', sh).onclick = close;
  let y0 = null, dy = 0; const grab = $('.grab', sh), head = $('.sh', sh);
  [grab, head].forEach(el => {
    el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; sh.style.transition = 'none'; }, { passive: true });
    el.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    el.addEventListener('touchend', () => { sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) close(); y0 = null; dy = 0; });
  });
  const body = $('.sb', sh);
  onMount && onMount(sh, close, body);
  return close;
}
function closeAllSheets() { [...sheetStack].forEach(c => c()); }

function shrinkImage(file, max, q = .8) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => res(null); img.src = url;
  });
}

async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Panoya kopyalandı'); } catch (e) { toast('Kopyalanamadı'); }
}

function renderJournal(app) {
  const logs = sortedLogs();
  if (!ui.calMonth) { const d = new Date(); ui.calMonth = [d.getFullYear(), d.getMonth()]; }
  let body = '';
  if (!logs.length) body = `<div class="empty"><div class="big">📖</div>Henüz kayıt yok. İlk albümünü dinleyip puanla.</div>`;
  else if (ui.journalMode === 'liste') {
    let cur = '';
    const mKey = l => parseYmd(l.date).toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
    const counts = {}; logs.forEach(l => { const m = mKey(l); counts[m] = (counts[m] || 0) + 1; });
    for (const l of logs) {
      const m = mKey(l);
      if (m !== cur) { body += `<div class="h-sec">${esc(m)} <span style="color:var(--dim);font-family:Inter;letter-spacing:0;text-transform:none">${counts[m]} albüm</span></div>`; cur = m; }
      body += logRow(l);
    }
  } else if (ui.journalMode === 'kapak') {
    body = `<div class="grid3" style="margin-top:12px">${logs.map(l => `<div class="g" data-open="${l.id}">${coverHtml(l.album, '100%', 200)}${badge(finalScore(l))}</div>`).join('')}</div>`;
  } else {
    const [y, m] = ui.calMonth;
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
    const off = (first.getDay() + 6) % 7;
    const by = logsByDate();
    const title = first.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
    const monthLogs = logs.filter(l => { const d = parseYmd(l.date); return d.getFullYear() === y && d.getMonth() === m; });
    const mAvg = monthLogs.length ? monthLogs.reduce((s, l) => s + (finalScore(l) || 0), 0) / monthLogs.length : null;
    let cells = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(d => `<div class="wd">${d}</div>`).join('');
    for (let i = 0; i < off; i++) cells += `<div class="c out"></div>`;
    for (let d = 1; d <= days; d++) {
      const k = `${y}-${pad(m + 1)}-${pad(d)}`; const ls = by[k] || [];
      const img = ls[0] && (ls[0].album.thumb || ls[0].album.cover);
      cells += `<div class="c ${ls.length ? 'has' : ''} ${k === today() ? 'today' : ''}" ${ls.length ? `data-day="${k}"` : ''}>${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}<span class="dn">${d}</span>${ls.length > 1 ? `<span class="cnt">${ls.length}</span>` : ''}</div>`;
    }
    body = `<div class="cal-h"><button class="iconbtn" id="cPrev">‹</button><div style="text-align:center"><h3>${esc(title)}</h3>
      <div class="muted" style="font-size:12px">${monthLogs.length} albüm${mAvg != null ? ' · ort. ' + fmtScore(mAvg) : ''}</div></div><button class="iconbtn" id="cNext">›</button></div>
      <div class="cal">${cells}</div>`;
    if (monthLogs.length) {
      const top = [...monthLogs].sort((a, b) => (finalScore(b) || 0) - (finalScore(a) || 0))[0];
      body += `<div class="h-sec">Ayın albümü 👑</div>${logRow(top)}`;
    }
  }
  app.innerHTML = `<div class="view">${segHtml('seg', [['liste', 'Liste'], ['kapak', 'Kapaklar'], ['takvim', 'Takvim']], ui.journalMode)}${body}</div>`;
  bindSeg('seg', k => { ui.journalMode = k; render(); });
  if ($('#cPrev')) {
    $('#cPrev').onclick = () => { let [y, m] = ui.calMonth; m--; if (m < 0) { m = 11; y--; } ui.calMonth = [y, m]; render(); };
    $('#cNext').onclick = () => { let [y, m] = ui.calMonth; m++; if (m > 11) { m = 0; y++; } ui.calMonth = [y, m]; render(); };
    $$('[data-day]').forEach(c => c.onclick = () => {
      const ls = logsByDate()[c.dataset.day];
      if (ls.length === 1) openDetail(ls[0].id);
      else openSheet(fmtDate(c.dataset.day), ls.map(logRow).join(''), sh => $$('[data-open]', sh).forEach(el => el.onclick = () => openDetail(el.dataset.open)));
    });
  }
  bindCommon(app);
}

function collage(albums) {
  const imgs = albums.filter(a => a.thumb || a.cover).slice(0, 4);
  if (!imgs.length) return `<div class="collage" style="display:grid;place-items:center;color:var(--dim)">${PH}</div>`;
  if (imgs.length < 4) return `<div class="collage" style="display:block"><img src="${esc(imgs[0].thumb || imgs[0].cover)}" alt=""></div>`;
  return `<div class="collage">${imgs.map(a => `<img src="${esc(a.thumb || a.cover)}" alt="" loading="lazy">`).join('')}</div>`;
}

function renderRecs(el) {
  const R = S.meta.recs;
  const hidden = new Set(S.meta.recsHidden);
  const known = new Set([...S.logs.map(l => normA(l.album.artist)), ...S.queue.map(q => normA(q.album.artist))]);
  const list = R ? R.list.filter(r => !hidden.has(normA(r.name)) && !known.has(normA(r.name))) : [];
  const seeds = topSeeds();
  el.innerHTML = `

      ${seeds.length ? `<button class="btn red block" id="rGo" style="margin-top:12px">${R ? '↻ Önerileri yenile' : 'Önerileri getir'}</button>` : ''}
      ${R ? `<div class="muted" style="font-size:11px;margin-top:8px;text-align:center">Son güncelleme: ${new Date(R.at).toLocaleDateString('tr-TR')} · Deezer</div>` : ''}
    </div>
    <div id="rList" style="margin-top:12px">${list.length ? `<div class="recs">${list.slice(0, 20).map(r => `<div class="card rec">
      ${r.picture ? `<img src="${esc(r.picture)}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <button class="x" data-hide="${esc(r.name)}" aria-label="Gizle">✕</button>
      <div class="a">${esc(r.name)}</div><div class="b">${esc(r.because.slice(0, 2).join(' ve '))}${r.because.length > 2 ? ` +${r.because.length - 2}` : ''} sevdiğin için</div>
      <button class="btn sm" data-albums="${esc(r.name)}">Albümleri</button>
      <button class="btn sm ghost" data-journey="${esc(r.name)}" style="margin-top:4px;color:var(--mute)">Yolculuk başlat</button></div>`).join('')}</div>` : (R ? '<div class="empty">Yeni öneri kalmadı, yenilemeyi dene.</div>' : '')}</div>`;
  if ($('#rGo')) $('#rGo').onclick = async () => {
    const b = $('#rGo'); b.disabled = true; b.textContent = 'Benzer gruplar aranıyor…';
    try { await buildRecs(seeds); render(); } catch (e) { toast('Öneriler alınamadı'); b.disabled = false; b.textContent = 'Tekrar dene'; }
  };
  $$('[data-hide]', el).forEach(b => b.onclick = () => { S.meta.recsHidden.push(normA(b.dataset.hide)); save(); render(); });
  $$('[data-albums]', el).forEach(b => b.onclick = () => openSearch('queue', b.dataset.albums));
  $$('[data-journey]', el).forEach(b => b.onclick = () => openNewJourney(b.dataset.journey));
}
function topSeeds() {
  const m = {};
  S.logs.forEach(l => { const s = finalScore(l); if (s == null) return; const k = normA(l.album.artist); (m[k] = m[k] || { name: l.album.artist, sum: 0, n: 0 }); m[k].sum += s; m[k].n++; });
  return Object.values(m).map(x => ({ ...x, avg: x.sum / x.n })).filter(x => x.avg >= 7).sort((a, b) => b.avg * Math.sqrt(b.n) - a.avg * Math.sqrt(a.n)).slice(0, 8);
}
async function buildRecs(seeds) {
  const agg = {};
  for (const s of seeds) {
    try {
      const rel = await API.related(s.name);
      rel.forEach((r, i) => {
        const k = normA(r.name);
        (agg[k] = agg[k] || { name: r.name, picture: r.picture, fans: r.fans, because: [], w: 0 });
        if (!agg[k].because.includes(s.name)) agg[k].because.push(s.name);
        agg[k].w += (15 - i) * s.avg;
      });
    } catch (e) {}
  }
  const list = Object.values(agg).sort((a, b) => b.because.length - a.because.length || b.w - a.w).slice(0, 40);
  if (!list.length) throw new Error('empty');
  S.meta.recs = { at: Date.now(), list }; save();
}

function latestPerAlbum(arr, keyFn = x => albumKey(x.l.album)) {

}
function statsFor(logs) {
  const scored = logs.map(l => ({ l, s: finalScore(l) })).filter(x => x.s != null);
  const avg = scored.length ? scored.reduce((a, x) => a + x.s, 0) / scored.length : null;
  const allTracks = logs.flatMap(l => l.tracks.filter(t => !t.skip && t.score != null).map(t => ({ ...t, l })));
  const ms = logs.reduce((a, l) => a + totalMs(l.tracks), 0);

    topAlbums: latestPerAlbum(scored).sort((a, b) => b.s - a.s || b.l.createdAt - a.l.createdAt),
    topTracks: latestPerAlbum(allTracks, t => albumKey(t.l.album) + '#' + normT(t.title)).sort((a, b) => b.score - a.score || (b.fav - a.fav)),

      if (!(await dialog({ title: 'Her şey silinsin mi?', text: 'Tüm seanslar, puanlar, konserler ve raf kalıcı olarak silinecek. Önce yedek almanı öneririm.', ok: 'Hepsini sil' }))) return;
      S = blank(); S.settings.badgesInit = true; save(); close(); render(); toast('Tüm veriler silindi');
    };
  });
}

/* =========================================================
   BOOT
   ========================================================= */
if (!S.settings.badgesInit) { S.badges = badgeDefs().filter(b => b.on).map(b => b.id); S.settings.badgesInit = true; save(); }
render();
setTimeout(resolveCountries, 2500);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.__ritual = { get S() { return S; }, render, checkBadges };
})();

</script>
